<head>

<title>Enta: Sign Up + Login Prototype | Lums</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --primary:#175CD3;
  --shadow1: 0 1px 2px rgba(16,24,40,0.05);
  --shadow3: 0 12px 32px rgba(0,0,0,0.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#E4E7EC;font-family:"Instrument Sans",system-ui,sans-serif;color:#101828;}

.viewport{width:100vw;min-height:100vh;overflow-x:hidden;padding:24px 0;display:block;}
.canvas-wrap{margin:0 auto;}
.canvas{position:relative;width:1440px;height:1024px;background:#F9FAFB;overflow:hidden;transform-origin:top left;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 40px rgba(16,24,40,.10);outline:1px solid rgba(16,24,40,.12);}
.frame{position:absolute;inset:0;width:1440px;height:1024px;}
.hot{position:absolute;cursor:pointer;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer;border:0;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff;border-radius:8px;height:48px;padding:0 18px;font-size:16px;box-shadow:var(--shadow1)}
.btn-primary:hover{background:#1448a8}
.btn-outline{background:#fff;color:#344054;border:1px solid #D0D5DD;border-radius:8px;height:40px;padding:0 14px;font-size:14px;font-weight:600;box-shadow:var(--shadow1);cursor:pointer;font-family:inherit}
.btn-outline:hover{background:#F9FAFB}
.btn-disabled{background:#F2F4F7;color:#98A2B3;border-radius:8px;height:48px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-awaiting{background:#F2F4F7;color:#98A2B3;border:none;border-radius:8px;height:48px;width:100%;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:not-allowed;font-family:inherit}
.btn-awaiting .spinner{width:18px;height:18px;border:2px solid #D0D5DD;border-top-color:#667085;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Logo */
.logo{display:inline-flex;align-items:center;height:32px}
.logo img{height:32px;width:auto;display:block}
.logo.light img{filter: brightness(0) invert(1);}

.head{position:absolute;left:80px;top:48px;}
.head-right{position:absolute;right:80px;top:48px;display:flex;align-items:center;gap:16px;}
.head-right .small{color:#344054;font-size:14px}

.card{background:#fff;border-radius:16px;padding:40px;box-shadow:var(--shadow1);border:1px solid #E4E7EC}

.selectors{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sel{position:relative;border:1px solid #E4E7EC;border-radius:12px;padding:16px;cursor:pointer;background:#fff;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:12px;height:128px;justify-content:center}
.sel:hover{border-color:#1570EF}
.sel .icon{width:36px;height:36px;border-radius:9999px;background:#F9FAFB;display:flex;align-items:center;justify-content:center;color:#667085;margin:0;flex:none}
.sel.selected{border-color:#1570EF;background:#EFF8FF}
.sel.selected .icon{background:#D1E9FF;color:#175CD3}
.sel h4{margin:0;font-size:14px;font-weight:700;color:#101828;line-height:20px;text-align:center}
.sel p{margin:0;font-size:12px;color:#344054;line-height:18px;text-align:center}

.sel .corner{position:absolute;top:-1px;right:-1px;width:32px;height:32px;display:none;pointer-events:none;border-top-right-radius:12px;overflow:hidden;}
.sel.selected .corner{display:block;}
.sel.selected .corner::before{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 32px 32px 0;border-color:transparent #175CD3 transparent transparent;}
.sel.selected .corner svg{position:absolute;top:5px;right:4px;width:12px;height:8px;color:#fff;}

.helper{background:#F9FAFB;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;color:#667085;line-height:20px;margin-top:16px;text-align:center}

.h1{font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.02em;color:#101828;margin:0}
.sub{font-size:16px;line-height:24px;color:#344054;margin:0}
.sub strong{font-weight:600}

.steps{display:flex;align-items:center;gap:12px}
.steps .bars{display:flex;gap:4px}
.steps .seg{width:17px;height:4px;border-radius:99px;background:#E4E7EC}
.steps .seg.on{background:#175CD3}
.steps .label{font-size:12px;line-height:18px;color:#667085}

.back{display:inline-flex;align-items:center;gap:6px;color:#344054;font-size:14px;font-weight:600;cursor:pointer}
.back svg{width:16px;height:16px}

.field label{display:block;font-size:14px;font-weight:500;color:#344054;margin-bottom:6px;line-height:20px}
.field .input-wrap{position:relative}
.field input{width:100%;height:48px;border:1px solid #D0D5DD;border-radius:8px;padding:0 14px;font:inherit;font-size:14px;line-height:20px;color:#101828;outline:none;box-shadow:var(--shadow1)}
.field input::placeholder{color:#667085}
.field input:focus{border-color:#175CD3;box-shadow:0 0 0 4px rgba(23,92,211,.14)}
.field.has-error input{border-color:#D92D20;padding-right:42px}
.field.has-error input:focus{border-color:#D92D20;box-shadow:0 0 0 4px rgba(217,45,32,.14)}
.field .err-icon{display:none;position:absolute;top:50%;right:14px;transform:translateY(-50%);color:#D92D20;width:16px;height:16px;pointer-events:none}
.field.has-error .err-icon{display:block}
.field .err-msg{display:none;margin-top:6px;font-size:14px;line-height:20px;color:#D92D20;font-weight:500}
.field.has-error .err-msg{display:block}

.otp-row{display:flex;gap:8px}
.otp-box{flex:1;min-width:0;width:0;height:64px;border:1px solid #D0D5DD;border-radius:8px;background:#fff;font:700 32px/40px "Instrument Sans",sans-serif;color:#101828;text-align:center;outline:none;box-shadow:var(--shadow1)}
.otp-box:focus{border-color:#175CD3;box-shadow:0 0 0 4px rgba(23,92,211,.14)}
.otp-box.filled{border-color:#175CD3}

.row-card{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:24px}
.row-card.no-border{border:none}
.row-flex{display:flex;align-items:center;gap:24px}
.row-icon{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;color:#667085}
.row-icon svg{width:40px;height:40px}
.row-title{font-weight:700;font-size:16px;color:#101828;margin-bottom:4px}
.row-sub{font-size:14px;color:#667085;line-height:20px}
.badge-success{display:inline-flex;align-items:center;gap:4px;background:#ECFDF3;border:1px solid #AAEFC6;color:#067647;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:600;flex:none}
.steps-num{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.steps-num .step{display:flex;align-items:center;gap:8px;font-size:13px;color:#344054}
.steps-num .num{width:22px;height:22px;border-radius:99px;background:#F4F3FF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#5925DC;flex:none}

/* OS overlays */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center;z-index:10;}
/* macOS "Create a passkey" sheet — Chrome credential dialog */
.macsheet{width:449px;background:#2a2a2a;color:#EAEAEA;border-radius:4px;padding:27px 16px 16px 16px;box-shadow:0 25px 45px rgba(0,0,0,.45);font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif}
.macsheet .illo{width:280px;height:93px;margin:0 auto 28px;position:relative}
.macsheet .h{font-family:'Roboto',sans-serif;font-size:16px;font-weight:400;color:#EAEAEA;margin:0;line-height:1.2}
.macsheet .row{margin-top:20px;border-top:1px solid #3F3F3F;border-bottom:1px solid #3F3F3F;padding:11px 8px;display:flex;align-items:center;gap:14px}
.macsheet .row .ricon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#5C8BEF}
.macsheet .row .ruser{font-size:14px;color:#EAEAEA}
.macsheet .note{margin:20px 0 0 0;font-size:14px;color:#EAEAEA;line-height:1.2}
.macsheet .actions{margin-top:36px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.macsheet .actions .spacer{width:53px}
.macsheet .btn-mac{background:transparent;color:#989898;border:.5px solid #575757;border-radius:4px;padding:8px 16px;font-family:'SF Pro Text','SF Pro',-apple-system,sans-serif;font-size:13px;font-weight:500;cursor:pointer;line-height:1}
.macsheet .btn-mac:hover{background:#3a3a3a;color:#dcdcdc}
.macsheet .btn-mac.primary{background:#AFAFAF;color:#060606;border-color:#DADADA}
.macsheet .btn-mac.primary:hover{background:#c8c8c8}

/* macOS Touch ID dialog — Chrome credential get */
.mactouch{width:252px;background:#2F1D1B;color:#fff;border-radius:10px;border:1px solid #584A49;padding:17px;box-shadow:0 20px 30px rgba(0,0,0,.45);text-align:center;font-family:'SF Pro Text','SF Pro',-apple-system,sans-serif}
.mactouch .medallion{position:relative;width:99px;height:73px;margin:0 auto 8px}
.mactouch .fpcircle{position:absolute;left:23px;top:0;width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#F4F5F5 0%,#DFDFDF 100%);border:.5px solid #BBB;box-shadow:0 1px 1px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#D62E4E}
.mactouch .browser{position:absolute;left:53px;top:29px;width:24px;height:24px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mactouch .browser svg{width:20px;height:20px;display:block}
.mactouch .bname{font-size:13px;font-weight:700;color:#fff;margin:0;line-height:1}
.mactouch .ctxt{margin-top:12px;font-size:11px;font-weight:700;color:#fff;line-height:1.18}
.mactouch .cta{margin-top:12px;font-size:11px;font-weight:400;color:#fff;line-height:1.18}
.mactouch .stack{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.mactouch .btn-touch{width:100%;height:27px;border-radius:5px;border:0;font-family:'SF Pro Text','SF Pro',-apple-system,sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.mactouch .btn-touch.use-pwd{background:#F6F1EB;color:#000;font-weight:500}
.mactouch .btn-touch.cancel{background:#A7A19C;color:#fff;font-weight:700;border:1px solid #777}
.mactouch .btn-touch:hover{filter:brightness(1.06)}

.oswin{width:440px;background:#fafafa;color:#1a1a1a;border-radius:8px;padding:20px;box-shadow:var(--shadow3)}
.oswin .titlebar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#1a1a1a;margin-bottom:12px}
.oswin .titlebar .l{display:flex;align-items:center;gap:8px}
.oswin h3{margin:6px 0 8px 0;font-size:18px;font-weight:600;color:#1a1a1a}
.oswin p{margin:0 0 8px 0;font-size:13px;color:#1a1a1a;line-height:18px}
.oswin .biocircle{width:54px;height:54px;border-radius:50%;border:2px solid #1a1a1a;border-bottom-color:transparent;border-left-color:transparent;transform:rotate(45deg);margin:24px auto 12px;}
.oswin .lookfor{text-align:center;font-weight:600;font-size:15px;margin:0 0 18px 0}
.oswin .more{color:#0067c0;font-size:13px;margin:8px 0;cursor:pointer}
.oswin .actions{display:flex;gap:10px;justify-content:flex-end}
.oswin .btn-w{background:#fff;color:#1a1a1a;border:1px solid #d0d0d0;border-radius:2px;padding:8px 18px;font:inherit;font-size:13px;cursor:pointer;min-width:90px}
.oswin .btn-w.primary{background:#0067c0;border-color:#0067c0;color:#fff}

.qrover{width:480px;background:#3a3a3a;color:#fff;border-radius:14px;padding:24px;box-shadow:var(--shadow3)}
.qrover h3{margin:0 0 6px 0;font-size:15px;font-weight:600}
.qrover p{margin:0 0 16px 0;font-size:13px;color:#bdbdbd;line-height:18px}
.qrover .qrbox{background:#fff;border-radius:10px;padding:14px;display:flex;justify-content:center}
.qrover .qrbox object{width:280px;height:280px}
.qrover .actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px}

/* Chrome WebAuthn "Sign In" QR-share dialog */
.csqr{width:507px;background:#2a2a2a;color:#EAEAEA;border-radius:4px;padding:18px 20px 20px 20px;box-shadow:0 25px 45px rgba(0,0,0,.45);font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif}
.csqr .titlebar{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid #3F3F3F}
.csqr .titlebar .l{display:flex;align-items:center;gap:10px;font-size:14px;color:#EAEAEA}
.csqr .titlebar .l svg{color:#EAEAEA}
.csqr .titlebar .cancel{background:#4a4a4a;color:#EAEAEA;border:.5px solid #5a5a5a;border-radius:4px;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer}
.csqr .titlebar .cancel:hover{background:#5a5a5a}
.csqr p{margin:18px 0 18px 0;font-size:13px;color:#EAEAEA;line-height:18px;text-align:center}
.csqr .qrbox{background:#fff;border-radius:6px;padding:16px;width:240px;height:240px;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative}
.csqr .qrbox object{width:100%;height:100%}
.csqr .qrcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1a1a1a}
.csqr .helper{margin-top:12px;font-size:11px;color:#9a9a9a;text-align:center;cursor:pointer}

/* Hero */
.hero{position:absolute;left:748px;top:24px;width:668px;height:976px;border-radius:24px;overflow:hidden;background:#0b1220;}
.hero video.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;}
.hero::before{content:"";position:absolute;left:0;top:0;width:100%;height:99px;background:linear-gradient(rgba(3,25,96,0.46),rgba(75,75,75,0));z-index:1;}
.hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);pointer-events:none;z-index:1;}
.hero .signin-row{position:absolute;right:32px;top:32px;display:flex;align-items:center;gap:16px;color:#fff;font-size:14px;z-index:2}
.hero .copy{position:absolute;left:48px;top:606px;width:461px;color:#fff;z-index:2}
.hero .copy h2{font-size:30px;line-height:38px;font-weight:700;margin:0 0 24px 0;width:244px;letter-spacing:-.01em}
.hero .feat{background:rgba(242,244,247,.92);backdrop-filter:blur(8px);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;color:#101828;margin-bottom:16px}
.hero .feat .fi{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#175CD3;flex:none}
.hero .feat h4{margin:0 0 4px 0;font-size:14px;font-weight:700;line-height:20px;color:#101828}
.hero .feat p{margin:0;font-size:12px;color:#667085;line-height:18px}

/* Login */
.login-bg{position:absolute;inset:0;background:#0b1220;overflow:hidden;}
.login-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.login-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.30) 0%,rgba(11,18,32,.55) 65%, rgba(11,18,32,.78) 100%);pointer-events:none;}

.dash{position:absolute;inset:0;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;letter-spacing:-.02em}

/* ============== Home screen (post-onboarding dashboard) ============== */
.home{position:absolute;inset:0;background:#fff;display:flex;flex-direction:row;font-family:"Instrument Sans",sans-serif;color:#101828}
.home-side{width:265px;background:#F9FAFB;border-right:1px solid #E4E7EC;display:flex;flex-direction:column;padding:32px 0;flex:none}
.home-side .logo{padding:0 24px 0 24px;margin-bottom:32px}
.home-side .logo img{height:32px;width:auto;display:block}
.home-nav{display:flex;flex-direction:column;gap:4px;padding:0 16px}
.home-nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:#344054;text-decoration:none;cursor:pointer}
.home-nav a:hover{background:#F2F4F7}
.home-nav a.on{background:#EFF8FF;color:#175CD3}
.home-nav a .ic{width:20px;height:20px;flex:none;color:currentColor}
.home-nav a .chev{margin-left:auto;width:16px;height:16px;color:#98A2B3;transition:transform .15s}
.home-nav a.has-sub .chev{color:#98A2B3}
.home-nav .sub{display:flex;flex-direction:column;gap:2px;padding-left:32px;margin-top:2px}
.home-nav .sub a{font-weight:500;color:#475467;padding:8px 12px}

.home-main{flex:1;min-width:0;display:flex;flex-direction:column;height:1024px;overflow:hidden}
.home-topbar{height:72px;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex:none;gap:24px}
.home-topbar .search{display:flex;align-items:center;gap:8px;width:320px;height:40px;background:#fff;border:1px solid #D0D5DD;border-radius:8px;padding:0 14px;color:#667085;font-size:14px}
.home-topbar .search svg{width:16px;height:16px;color:#667085;flex:none}
.home-topbar .right{display:flex;align-items:center;gap:16px;margin-left:auto}
.home-topbar .bell{position:relative;width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#344054;cursor:pointer}
.home-topbar .bell:hover{background:#F2F4F7}
.home-topbar .bell .dot{position:absolute;top:7px;right:9px;width:9px;height:9px;border-radius:50%;background:#175CD3;border:2px solid #F9FAFB}
.home-topbar .avatar{width:40px;height:40px;border-radius:9999px;background-image:url("assets/avatar-jamie.png");background-size:cover;background-position:center;position:relative;border:.75px solid rgba(0,0,0,.08);cursor:pointer}
.home-topbar .avatar.placeholder{background-image:none;background:#F2F4F7;display:flex;align-items:center;justify-content:center;color:#98A2B3}
.home-topbar .avatar.placeholder::after{display:none}
.home-topbar .avatar.placeholder svg{width:22px;height:22px}
.home-topbar .avatar:not(.placeholder)::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#12B76A;border:1.5px solid #fff}
.home-topbar .avatar{cursor:pointer}
.acct-anchor{position:relative}
.acct-pop{position:absolute;right:0;top:52px;width:233px;background:#fff;border:1px solid #E4E7EC;border-radius:8px;box-shadow:0 4px 6px -2px rgba(16,24,40,.03),0 12px 16px -4px rgba(16,24,40,.08);z-index:50;overflow:hidden;font-family:"Instrument Sans",sans-serif}
.acct-pop .ap-head{display:flex;align-items:center;gap:12px;padding:12px 16px}
.acct-pop .ap-avatar{width:40px;height:40px;border-radius:9999px;background:#F2F4F7;display:flex;align-items:center;justify-content:center;color:#98A2B3;flex:none}
.acct-pop .ap-avatar svg{width:22px;height:22px}
.acct-pop .ap-name{font-size:14px;font-weight:700;line-height:20px;color:#344054;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Balance card ---- */

.bal-card .top .left .amt{margin-top:8px;display:flex;align-items:flex-start;gap:6px;font-size:30px;font-weight:700;line-height:38px;color:#101828}

.bal-card .top .left .amt .eye{width:24px;height:24px;color:#667085;cursor:pointer;margin-top:7px;margin-left:7px}
.bal-card .top .left .gbp{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;line-height:18px;color:#344054}

.bal-card .top .left .gbp .gbp-arrow{width:12px;height:12px;color:#667085;margin-left:2px}
.bal-card .top .right .b{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:8px;background:#175CD3;color:#fff;font:600 16px/24px "Instrument Sans",sans-serif;border:0;cursor:pointer;box-shadow:0 1px 2px 0 rgba(16,24,40,.05), inset 0 -2px 0 0 rgba(16,24,40,.05), inset 0 0 0 1px rgba(16,24,40,.18)}

/* ---- Rate calculator ---- */
.rate-card{border-radius:12px;background:#F9FAFB;border:1px solid #E4E7EC;padding:20px;position:relative;height:322px;display:flex;flex-direction:column;box-sizing:border-box}

.tx-row .right .amt{font-size:14px;font-weight:700;color:#101828}

.setup-card,.help-card{background:#fff;border:1px solid #E4E7EC;border-radius:12px;padding:24px}

.home-v2 .home-content{padding:32px 40px 80px}

/* KYC banner v2 (fuchsia) */
.kyc-v2{display:flex;align-items:center;gap:24px;background:#FDF4FF;border-radius:12px;padding:20px;margin-top:24px}

/* ============== KYC verify-identity screens ============== */
.kyc-screen{position:absolute;inset:0;background:#fff;font-family:"Instrument Sans",sans-serif}
.kyc-head{position:absolute;left:80px;top:48px;right:80px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.kyc-head .ttl{font-size:24px;line-height:32px;font-weight:700;color:#101828;margin:0}
.kyc-head .sub{margin:4px 0 0 0;font-size:16px;line-height:24px;color:#475467;font-weight:400}
.kyc-close{width:44px;height:44px;border-radius:8px;border:0;background:transparent;padding:10px;display:flex;align-items:center;justify-content:center;color:#101828;cursor:pointer;flex:none}
.kyc-close:hover{background:#F9FAFB}
.kyc-close svg{width:24px;height:24px;display:block}

/* Vertical progress stepper — Figma spec: 24px icon, 12px gap to label, 2x14 connector below each non-last step */
.kyc-steps{position:absolute;left:80px;top:156px;width:267px;display:flex;flex-direction:column}
.kyc-step{position:relative;display:flex;flex-direction:row;gap:12px;width:267px;height:46px}
.kyc-step .ind-col{width:24px;height:46px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:4px;flex:none}
.kyc-step .ind{width:24px;height:24px;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;box-sizing:border-box}
.kyc-step.incomplete .ind{background:#F9FAFB;border:1.5px solid #E4E7EC}
.kyc-step.incomplete .ind::after{content:"";width:8px;height:8px;border-radius:9999px;background:#D0D5DD}
.kyc-step.current .ind,.kyc-step.complete .ind{background:#175CD3}
.kyc-step.current .ind::after{content:"";width:8px;height:8px;border-radius:9999px;background:#fff}
.kyc-step.complete .ind svg{width:12px;height:12px;color:#fff;display:block}
.kyc-step .conn{width:2px;height:14px;border-radius:2px;background:#E4E7EC;flex:none}
.kyc-step.complete .conn{background:#1570EF}
.kyc-step .label-col{padding:2px 0 24px 0;flex:1;min-width:0}
.kyc-step .label{font-family:"Instrument Sans",sans-serif;font-size:14px;line-height:20px;font-weight:400;color:#344054}
.kyc-step.current .label{font-weight:700;color:#102A56}

.kyc-panel{position:absolute;left:455px;top:156px;width:531px;bottom:24px;display:flex;flex-direction:column;gap:40px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.kyc-panel::-webkit-scrollbar{width:0;height:0;display:none}
.kyc-panel h2{margin:0;font-size:20px;line-height:30px;font-weight:700;color:#101828}
.kyc-sec-head{display:flex;align-items:center;gap:12px;color:#475467}
.kyc-sec-head svg{width:24px;height:24px}

/* ============== KYC verify-identity screens ============== */
function KycStepper(active){
  // active: 'profile' | 'identity' | 'idv'
  const steps = [
    { id:'profile',  label:'Profile information' },
    { id:'identity', label:'Identity' },
    { id:'idv',      label:'ID Verification' },
  ];
  const order = steps.map(s=>s.id);
  const activeIx = order.indexOf(active);
  return `<aside class="kyc-steps">
    ${steps.map((s,i)=>{
      const state = i < activeIx ? 'complete' : i === activeIx ? 'current' : 'incomplete';
      const isLast = i === steps.length - 1;
      const inner = state === 'complete'
        ? `<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg>`
        : '';
      const connState = state === 'complete' ? 'complete' : '';
      return `<div class="kyc-step ${state}">
        <div class="ind-col">
          <div class="ind">${inner}</div>
          ${isLast ? '' : `<div class="conn ${connState}"></div>`}
        </div>
        <div class="label-col"><span class="label">${s.label}</span></div>
      </div>`;
    }).join('')}
  </aside>`;
}

function KycHeader(){
  return `<div class="kyc-head">
    <div>
      <h1 class="ttl">Verify identity</h1>
      <p class="sub">Unlock the rest of Enta</p>
    </div>
    <button class="kyc-close" data-act="kyc-close" aria-label="Close">
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128 50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></svg>
    </button>
  </div>`;
}

function _kycField(label, opts){
  opts = opts || {};
  const helpHtml = opts.help ? `<div class="help">${opts.help}</div>` : '';
  return `<div class="kyc-field">
    <label>${label}</label>
    ${opts.control}
    ${helpHtml}
  </div>`;
}

window.__kycUpdateAddrLabels = function(code){
  var maps = {
    'NG': { city:'City', state:'State', postal:null },
    'US': { city:'Town', state:'State', postal:'ZIP code' },
    'CA': { city:'City', state:'Province', postal:'Postal code' },
    'GB': { city:'City', state:'County', postal:'Postcode' }
  };
  var def = { city:'City/Town/Locality', state:'State/Province/Region', postal:'Postal code / ZIP code' };
  var m = maps[code] || def;
  var lc = document.getElementById('kyc-label-city');   if (lc) lc.textContent = m.city;
  var ls = document.getElementById('kyc-label-state');  if (ls) ls.textContent = m.state;
  var lp = document.getElementById('kyc-label-postal'); if (lp) lp.textContent = m.postal || '';
  var fp = document.getElementById('kyc-field-postal'); if (fp) fp.style.display = m.postal ? '' : 'none';
};

function ActionCardHtml(a){
  if (a.preview) return DeepLinkPreviewHtml(a.preview);
  const tab = a.tab;
  const routes = ROUTES_V2[tab] || [];
  const cur = tab==='deposit' ? a.depositAsset : tab==='withdraw' ? a.withdrawAsset : null;
  const curRoute = tab==='deposit' ? a.depositRoute : tab==='withdraw' ? a.withdrawRoute : null;
  const routeOpt = curRoute && routes.find(r=>r.id===curRoute);

  // amount enable + helper
  let amountEnabled=false, amountLabel='', helper='';
  if (tab==='deposit'){
    if (curRoute==='external_wallet'){ amountEnabled=false; amountLabel='No amount needed'; helper="Sender determines how much to send. You'll get a receive address."; }
    else if (curRoute==='bank_account'){ amountEnabled=true; amountLabel='Amount to receive'; }
    else if (cur){ amountEnabled=true; }
  } else if (tab==='withdraw'){
    if (curRoute){ amountEnabled=true; amountLabel='Amount to send'; }
    else if (cur){ amountEnabled=true; }
  } else if (tab==='swap'){
    if (a.swapFrom && a.swapTo){ amountEnabled=true; amountLabel='Amount to swap'; }
  }

  // canProceed
  let canProceed=false;
  if (tab==='deposit'){
    if (cur && curRoute){
      canProceed = curRoute==='external_wallet' ? true : (a.amount && parseFloat(a.amount)>0);
    }
  } else if (tab==='withdraw'){
    canProceed = !!cur && !!curRoute && a.amount && parseFloat(a.amount)>0;
  } else if (tab==='swap'){
    canProceed = a.swapFrom && a.swapTo && a.swapFrom!==a.swapTo && a.amount && parseFloat(a.amount)>0;
  }

  const tabsHtml = ['deposit','withdraw','swap'].map(id=>{
    const lab = id[0].toUpperCase()+id.slice(1);
    return `<button class="ac-tab ${tab===id?'on':''}" data-act="ac-tab:${id}">${lab}</button>`;
  }).join('');

  let pillsHtml = '';
  if (tab==='swap'){
    const fromA = a.swapFrom ? findAssetV2(a.swapFrom) : null;
    const toA   = a.swapTo   ? findAssetV2(a.swapTo)   : null;
    pillsHtml = `<div class="ac-pills">
      <div class="ac-pill-wrap">
        ${PillAsset(fromA,'From',a.openPicker==='swapFrom','ac-open:swapFrom')}
        ${a.openPicker==='swapFrom' ? AssetListPopover('ac-set-from', a.swapTo?[a.swapTo]:[]) : ''}
      </div>
      <span class="ac-arrow">${_ic('<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',{sw:2,size:18})}</span>
      <div class="ac-pill-wrap">
        ${PillAsset(toA,'To',a.openPicker==='swapTo','ac-open:swapTo')}
        ${a.openPicker==='swapTo' ? AssetListPopover('ac-set-to', a.swapFrom?[a.swapFrom]:[]) : ''}
      </div>
    </div>`;
  } else {
    const curA = cur ? findAssetV2(cur) : null;
    pillsHtml = `<div class="ac-pills">
      <div class="ac-pill-wrap">
        ${PillAsset(curA,'Asset',a.openPicker==='asset','ac-open:asset')}
        ${a.openPicker==='asset' ? AssetListPopover('ac-set-asset', []) : ''}
      </div>
      <div class="ac-pill-wrap">
        ${PillRoute(routeOpt, tab==='deposit'?'From':'To', a.openPicker==='route','ac-open:route')}
        ${a.openPicker==='route' ? RouteListPopover(tab,'ac-set-route') : ''}
      </div>
    </div>`;
  }

  const showSwapApprox = tab==='swap' && a.amount && parseFloat(a.amount)>0 && a.swapTo;

  return `<div class="ac-card">
    <div class="ac-tabs">${tabsHtml}</div>
    <div class="ac-body">
      <div class="ac-body-top">
        ${pillsHtml}
        <div class="ac-amount">
          <input type="text" inputmode="decimal" id="ac-amount-input" data-act="ac-amount" value="${a.amount}" placeholder="0" ${amountEnabled?'':'disabled'} class="${a.amount?'has':''}"/>
          ${amountLabel ? `<div class="ac-amount-label">${amountLabel}</div>` : ''}
          ${showSwapApprox ? `<div class="ac-approx">≈ ${(parseFloat(a.amount)*0.85).toFixed(4)} ${a.swapTo}</div>` : ''}
          ${helper ? `<div class="ac-helper">${IconInfo()}<span>${helper}</span></div>` : ''}
        </div>
      </div>
      <button class="ac-continue" data-act="ac-continue" ${canProceed?'':'data-dim="1"'}>Continue</button>
    </div>
  </div>`;
}

function DeepLinkPreviewHtml(p){
  const key = p.tab==='swap' ? 'swap' : `${p.tab}:${p.route}`;
  const dl = DEEP_LINKS_V2[key];
  if (!dl) return '';
  const vals = { asset:p.asset||'', fromAsset:p.fromAsset||'', toAsset:p.toAsset||'', amount: p.amount?p.amount:'—' };
  const fields = dl.fields.map(f => ({ ...f, value: fillTpl(f.value, vals) }));
  return `<div class="ac-card ac-preview">
    <div class="ac-pre-head">
      <button class="ac-back" data-act="ac-back">${IconArrowLeft()}</button>
      <div>
        <div class="eyebrow">Move Money · Scenario ${dl.scenarioId}</div>
        <div class="title">${dl.scenarioLabel}</div>
      </div>
    </div>
    <div class="ac-pre-body">
      <div>
        <div class="eyebrow">Next step</div>
        <div class="big">${dl.title}</div>
        <div class="lands">Lands on: <b>${dl.nextStep}</b></div>
      </div>
      <div>
        <div class="eyebrow">Pre-filled from home card</div>
        <div class="ac-fields">
          ${fields.map(f => `<div class="ac-field"><span class="k">${f.label}</span><span class="v">${f.value}</span></div>`).join('')}
        </div>
      </div>
      <div class="ac-note ${dl.warn?'warn':''}">${IconInfo()}<span>${dl.note}</span></div>
      <div class="ac-pre-actions">
        <button class="ac-continue" data-act="ac-open-flow">Open Move Money flow</button>
        <button class="ac-secondary" data-act="ac-back">← Back to home</button>
      </div>
    </div>
  </div>`;
}

const FLOWS = {
  "01": {name:"01 Happy Path — Mac", start:"signup-landing"},
  "02": {name:"02 Windows happy path", start:"signup-landing", os:"win"},
  "03": {name:"03 iCloud Keychain off", start:"passkey-desktop", preselect:"personal"},
  "04": {name:"04 Apple ID mismatch", start:"passkey-desktop", preselect:"personal"},
  "05": {name:"05 Sign up — device has no passkey hardware", start:"signup-landing", simBlocked:true, preselect:"personal"},
  "06": {name:"06 Sign in — happy (passkey)", start:"login"},
  "07": {name:"07 Sign in — no passkey on device", start:"login"},
  "08": {name:"08 Business signup", start:"signup-landing", preselect:"business"},
  "H6": {name:"09 Home — first time", start:"dashboard", homeOutcome:"first-time"},
  "HF": {name:"09 Home — First time (post-signup)", start:"dashboard", homeOutcome:"first-time"},
  "HK": {name:"10 Home — KYC in progress", start:"dashboard", homeOutcome:"kyc-progress"},
  "HT": {name:"11 Home — Tier 2 unlocked", start:"dashboard", homeOutcome:"tier2-unlocked"},
  "K1": {name:"12 KYC — verification flow", start:"kyc-profile"},
  "R1": {name:"13 Recover passkey from sign-in", start:"signin-recovery"},
};

const state = { flowId:"01", flow:FLOWS["01"], frame:"signup-landing", selected:null, simBlocked:false, os:"mac", overlay:null, history:[], homeOutcome:"tier2-unlocked", acctOpen:false };
window.state = state;
const canvas = document.getElementById('canvas');
const twCurrent = document.getElementById('tw-current');

function setFrame(id, opts={}){
  // reset interactive action-card state on any nav into dashboard
  if (id === 'dashboard') state.action = null;
  // tear down any running countdown
  if (state._resendTimer){ clearInterval(state._resendTimer); state._resendTimer = null; }
  if (!opts.noHistory && state.frame && state.frame !== id) state.history.push(state.frame);
  state.frame = id;
  const builder = FRAMES[id];
  const html = builder ? builder(state) : `<div class="dash">${id}</div>`;
  const div = document.createElement('div');
  div.className = "frame";
  div.innerHTML = html;
  [...canvas.querySelectorAll('.frame')].forEach(n=>n.remove());
  canvas.appendChild(div);
  twCurrent.textContent = id;
  if (!state.overlay) clearOverlay();
  if (id === 'verify') startResendCountdown(45);
  if (id === 'recovery-verify') {
    startResendCountdown(45);
    setTimeout(()=>{ const f = document.querySelector('.otp-box[data-otp="0"]'); if (f) f.focus(); }, 50);
  }
}

function startResendCountdown(seconds){
  if (state._resendTimer){ clearInterval(state._resendTimer); state._resendTimer = null; }
  state.resendReady = false;
  let s = seconds;
  const render = () => {
    const text = document.getElementById('resend-text');
    const ctrl = document.getElementById('resend-control');
    const prompt = document.getElementById('resend-prompt');
    if (!text || !ctrl) return false;
    if (s > 0) {
      const mm = Math.floor(s/60), ss = String(s%60).padStart(2,'0');
      text.textContent = `Resend in ${mm}:${ss}`;
      ctrl.style.color = '#344054';
      ctrl.style.cursor = 'default';
      if (prompt) prompt.textContent = "Didn't get it? Check spam";
    } else {
      text.textContent = 'Resend email';
      ctrl.style.color = '#175CD3';
      ctrl.style.cursor = 'pointer';
      if (prompt) prompt.textContent = 'Still no email?';
      state.resendReady = true;
    }
    return true;
  };
  if (!render()) return;
  state._resendTimer = setInterval(()=>{
    s -= 1;
    if (!render()) { clearInterval(state._resendTimer); state._resendTimer=null; return; }
    if (s <= 0){ clearInterval(state._resendTimer); state._resendTimer=null; }
  }, 1000);
}
function setAwaitingButton(awaiting){
  const btn = canvas.querySelector('button.btn-primary[data-act="os-mac-prompt"], button.btn-primary[data-act="os-win-prompt"]');
  if (!btn) return;
  if (awaiting){
    btn.dataset._origHtml = btn.innerHTML;
    btn.dataset._origAct = btn.dataset.act;
    btn.dataset._origClass = btn.className;
    btn.removeAttribute('data-act');
    btn.className = 'btn-awaiting';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Awaiting browser input</span>';
  } else {
    if (btn.dataset._origHtml){
      btn.innerHTML = btn.dataset._origHtml;
      btn.className = btn.dataset._origClass;
      btn.dataset.act = btn.dataset._origAct;
      btn.disabled = false;
    }
  }
}
function showOverlay(kind){
  clearOverlay();
  state.overlay = kind;
  const ov = document.createElement('div');
  ov.className = "scrim";
  ov.dataset.kind = kind;
  ov.innerHTML = OVERLAYS[kind]();
  canvas.appendChild(ov);
}
function clearOverlay(){
  state.overlay = null;
  [...canvas.querySelectorAll('.scrim')].forEach(n=> n.remove());
  setAwaitingButton(false);
}

function startFlow(id){
  state.flowId = id;
  state.flow = FLOWS[id];
  state.history = [];
  state.email = null;
  state.selected = state.flow.preselect || null;
  state.simBlocked = !!state.flow.simBlocked;
  // Mirror this flow into the axes panel so direct startFlow() calls stay consistent
  if (typeof axes !== 'undefined' && typeof axesFromFlowId === 'function') {
    Object.assign(axes, axesFromFlowId(id));
  }
  state.os = (typeof axes !== 'undefined' ? axes.os : null) || state.flow.os || 'mac';
  if (state.flow.homeOutcome) state.homeOutcome = state.flow.homeOutcome;
  state._loginPath = false;
  state._phoneSetup = false;
  clearOverlay();
  if (typeof paintAxes === 'function') paintAxes();
  document.getElementById('tw-path').value = id;
  setFrame(state.flow.start, {noHistory:true});
}

canvas.addEventListener('keydown', (e)=>{
  const inp = e.target.closest('.otp-box');
  if (!inp) return;
  const idx = parseInt(inp.dataset.otp,10);
  if (e.key === 'Backspace' && !inp.value){
    const prev = document.querySelector('.otp-box[data-otp="'+(idx-1)+'"]');
    if (prev){ prev.focus(); prev.value=''; prev.classList.remove('filled'); }
  } else if (e.key === 'ArrowLeft'){
    const prev = document.querySelector('.otp-box[data-otp="'+(idx-1)+'"]');
    if (prev) prev.focus();
  } else if (e.key === 'ArrowRight'){
    const next = document.querySelector('.otp-box[data-otp="'+(idx+1)+'"]');
    if (next) next.focus();
  }
});

canvas.addEventListener('input', (e)=>{
  const inp = e.target.closest('input');
  if (!inp) return;
  if (inp.classList && inp.classList.contains('otp-box')){
    const v = inp.value.replace(/[^0-9]/g,'').slice(0,1);
    inp.value = v;
    inp.classList.toggle('filled', !!v);
    if (v){
      const idx = parseInt(inp.dataset.otp,10);
      const next = document.querySelector('.otp-box[data-otp="'+(idx+1)+'"]');
      if (next) next.focus();
      else {
        // last box filled — auto-submit if all filled
        const all = [...document.querySelectorAll('.otp-box')];
        if (all.every(b => b.value)) {
          const row = inp.closest('[data-otp-row]');
          const act = row && row.dataset.otpSubmit || 'submit-recovery-otp';
          setTimeout(()=> handle(act), 200);
        }
      }
    }
    return;
  }
  if (inp.id === 'ac-amount-input'){
    const a = getAction();
    a.amount = inp.value.replace(/[^0-9.]/g,'');
    if (inp.value !== a.amount) inp.value = a.amount;
    inp.classList.toggle('has', !!a.amount);
    // re-render to update derived UI (continue button, swap approx)
    const sel = inp.selectionStart;
    rerenderActionCard();
    const ni = document.getElementById('ac-amount-input');
    if (ni){ ni.focus(); try{ ni.setSelectionRange(sel,sel); }catch(_){} }
    return;
  }
  const field = inp.closest('.field');
  if (field && field.classList.contains('has-error')) field.classList.remove('has-error');
});

// close action-card popovers on outside click
document.addEventListener('mousedown', (e)=>{
  // close account dropdown
  if (state.acctOpen && !e.target.closest('.acct-pop') && !e.target.closest('[data-act="toggle-acct"]')) {
    state.acctOpen = false;
    setFrame(state.frame, {noHistory:true});
  }
  if (!state.action || !state.action.openPicker) return;
  if (e.target.closest('.ac-pill, .ac-pop')) return;
  state.action.openPicker = null;
  rerenderActionCard();
});

canvas.addEventListener('keydown', (e)=>{
  if (e.key !== 'Enter') return;
  const inp = e.target.closest('#email-input');
  if (!inp) return;
  e.preventDefault();
  const btn = canvas.querySelector('[data-act="submit-email"]');
  if (btn) btn.click();
});

canvas.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-act]');
  if (!t) return;
  handle(t.dataset.act);
});

function handle(act){
  if (act !== 'toggle-acct' && state.acctOpen) state.acctOpen = false;
  switch(act){
    case "toggle-acct": state.acctOpen = !state.acctOpen; setFrame(state.frame,{noHistory:true}); return;
    case "acct-continue-setup": state.acctOpen=false; state.kycFrom = state.homeOutcome || 'first-time'; setFrame('kyc-profile'); return;
    case "kyc-close": {
      // Close from identity screen → profile is done, identity pending
      // Close from profile screen → return to where they came from
      const from = state.kycFrom || state.homeOutcome || 'first-time';
      if (state.frame === 'kyc-identity') state.homeOutcome = 'kyc-progress';
      else state.homeOutcome = from;
      state.kycFrom = null;
      setFrame('dashboard'); return;
    }
    case "kyc-back-to-home": {
      state.homeOutcome = state.kycFrom || state.homeOutcome || 'first-time';
      state.kycFrom = null;
      setFrame('dashboard'); return;
    }
    case "kyc-submit-profile": setFrame('kyc-identity'); return;
    case "kyc-simulate-verified": state.homeOutcome = 'tier2-unlocked'; state.kycFrom = null; setFrame('dashboard'); return;
    case "acct-link-existing": state.acctOpen=false; setFrame(state.frame,{noHistory:true}); return;
    case "select-personal": state.selected='personal'; setFrame('signup-landing',{noHistory:true}); break;
    case "select-business": state.selected='business'; setFrame('signup-landing',{noHistory:true}); break;
    case "goto-email-personal": setFrame('email-personal'); break;
    case "goto-email-business": setFrame('email-business'); break;
    case "goto-personal": state.selected='personal'; setFrame('signup-landing'); break;
    case "goto-business": state.selected='business'; setFrame('signup-landing'); break;
    case "goto-verify": setFrame('verify'); break;
    case "submit-email": {
      const inp = document.getElementById('email-input');
      const v = (inp && inp.value.trim()) || '';
      const field = inp && inp.closest('.field');
      const msg = field && field.querySelector('.err-msg');
      // valid email = something@something.tld
      const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
      if (!v) {
        field.classList.add('has-error');
        msg.textContent = 'Email address is required';
        inp.focus();
        break;
      }
      if (!validEmail) {
        field.classList.add('has-error');
        msg.textContent = 'Enter a valid email address';
        inp.focus();
        break;
      }
      field.classList.remove('has-error');
      state.email = v;
      setFrame('verify');
      break;
    }
    case "change-email": {
      // navigate back to the right email screen based on current flow
      const target = state.selected === 'business' ? 'email-business' : 'email-personal';
      setFrame(target);
      break;
    }
    case "resend-email": {
      // only resends after countdown hit 0
      if (state.resendReady) {
        state.resendReady = false;
        startResendCountdown(45);
      }
      break;
    }
    case "goto-passkey-desktop":
      if (state._phoneSetup) { state._phoneSetup=false; state.homeOutcome='tier2-unlocked'; setFrame('dashboard'); break; }
      setFrame('passkey-desktop');
      break;
    case "os-mac-prompt": setAwaitingButton(true); showOverlay('mac-prompt'); break;
    case "os-win-prompt": setAwaitingButton(true); showOverlay('win-prompt'); break;
    case "touchid-confirm":
      if (state._loginPath){ state._loginPath=false; clearOverlay(); state.homeOutcome='tier2-unlocked'; setFrame('dashboard'); break; }
      if (state._recoveryFinalize){ state._recoveryFinalize=false; clearOverlay(); setFrame('passkey-recovered-login'); break; }
      if (state.overlay === 'mac-prompt') { showOverlay('mac-touchid'); break; }
      if (state._recoveryPath) { state._recoveryPath=false; clearOverlay(); setFrame('recovery-email-otp-step'); break; }
      clearOverlay();
      setFrame('passkey-desktop-done');
      // for failure flows, branch on flow id
      setTimeout(()=>{
        if (state.flowId === '03') { setFrame('keychain-off'); }
        else { setFrame('passkey-phone'); }
      }, 1200);
      break;
    case "dismiss-overlay": clearOverlay(); break;
    case "show-qr": showOverlay('qr'); break;
    case "signin-show-qr": showOverlay('signin-qr'); state._loginPath = true; break;
    case "signin-qr-cancel": clearOverlay(); break;
    case "sim-qr-scanned":
      clearOverlay();
      if (state.flowId === '04') { setTimeout(()=> setFrame('apple-mismatch'), 800); break; }
      if (state._loginPath) {
        state._loginPath = false;
        state.homeOutcome = 'tier2-unlocked';
        setTimeout(()=> setFrame('dashboard'), 800);
      } else {
        setTimeout(()=> setFrame('recovery-email'), 800);
      }
      break;
    case "submit-recovery-email": {
      const inp = document.getElementById('recovery-email-input');
      const v = (inp && inp.value.trim()) || '';
      const field = inp && inp.closest('.field');
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) && v !== (state.email || '');
      if (!valid) { if (field) field.classList.add('has-error'); break; }
      state.recoveryEmail = v;
      setFrame('recovery-verify');
      break;
    }
    case "goto-recovery-email": setFrame('recovery-email'); break;
    case "change-recovery-email": setFrame('recovery-email'); break;
    case "submit-recovery-otp":
      state.homeOutcome = 'first-time';
      setFrame('dashboard');
      break;
    case "back-to-phone": setFrame('passkey-phone'); break;
    case "goto-blocked": setFrame('signup-blocked'); break;
    case "goto-phone-reroute": setFrame('phone-reroute'); break;
    case "signup-qr-different": setFrame('signup-blocked'); break;
    case "signup-qr-cancel": setFrame('signup-blocked'); break;
    case "sim-signup-qr-scanned":
      clearOverlay();
      state._phoneSetup = true;
      setFrame('email-personal');
      break;
    case "branch-windows": state.os='win'; setFrame('passkey-desktop'); break;
    case "goto-login": startFlow('06'); break;
    case "goto-signup": startFlow('01'); break;
    case "goto-no-passkey": setFrame('login'); break;
    case "goto-help": setFrame('help'); break;
    case "goto-signin-recovery": setFrame('signin-recovery'); break;
    case "submit-signin-recovery": {
      const inp = document.getElementById('signin-recovery-email');
      const err = document.getElementById('signin-recovery-email-err');
      const val = (inp && inp.value || '').trim();
      let msg = '';
      if (!val) msg = 'Enter your email address to continue.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) msg = "That doesn't look like a valid email. Check for typos and try again.";
      if (msg) {
        if (inp){ inp.style.borderColor='#F04438'; inp.style.boxShadow='0 0 0 4px #FEE4E2'; inp.focus(); }
        if (err){ err.textContent = msg; err.style.display='block'; }
        return;
      }
      state.recoveryEmail = val;
      setFrame('signin-recovery-inbox');
      break;
    }
    case "signin-recovery-resend": break;
    case "signin-recovery-change-email": setFrame('signin-recovery'); break;
    case "signin-recovery-simulate-link": setFrame('create-new-passkey'); break;
    case "submit-recovery-email-otp-step": {
      const boxes = [...document.querySelectorAll('#recovery-email-otp-row .otp-box')];
      const code = boxes.map(b => b.value).join('');
      if (!/^\d{6}$/.test(code)) {
        const errEl = document.getElementById('recovery-email-otp-step-err');
        if (errEl){ errEl.textContent = 'Enter the 6-digit code sent to your recovery email.'; errEl.style.display='block'; }
        return;
      }
      setFrame('finalize-passkey-recovery');
      break;
    }
    case "recovery-email-otp-step-simulate": {
      const boxes = [...document.querySelectorAll('#recovery-email-otp-row .otp-box')];
      const digits = String(Math.floor(100000 + Math.random()*900000));
      boxes.forEach((b,i)=> b.value = digits[i] || '');
      setFrame('finalize-passkey-recovery');
      break;
    }
    case "finalize-passkey-recovery-confirm": state._recoveryFinalize = true; showOverlay('mac-touchid'); break;
    case "passkey-recovered-login-continue": state._loginPath = true; showOverlay('mac-touchid'); break;
    case "recovery-email-otp-step-change": setFrame('signin-recovery'); break;
    case "create-new-passkey-confirm": setFrame('new-passkey-email-otp'); break;
    case "submit-new-passkey-otp": {
      const boxes = [...document.querySelectorAll('#new-passkey-otp-row .otp-box')];
      const code = boxes.map(b => b.value).join('');
      if (!/^\d{6}$/.test(code)) {
        const errEl = document.getElementById('new-passkey-otp-err');
        if (errEl){ errEl.textContent = 'Enter the 6-digit code sent to your email.'; errEl.style.display='block'; }
        return;
      }
      state._recoveryPath = true;
      setTimeout(()=>{ showOverlay(state.os==='win'?'win-prompt':'mac-prompt'); }, 50);
      break;
    }
    case "new-passkey-otp-simulate": {
      const boxes = [...document.querySelectorAll('#new-passkey-otp-row .otp-box')];
      const digits = String(Math.floor(100000 + Math.random()*900000));
      boxes.forEach((b,i)=> b.value = digits[i] || '');
      state._recoveryPath = true;
      setTimeout(()=>{ showOverlay(state.os==='win'?'win-prompt':'mac-prompt'); }, 50);
      break;
    }
    case "new-passkey-change-email": setFrame('signin-recovery'); break;
    case "goto-newdevice": setFrame('signin-phone-reroute'); break;
    case "goto-newdevice1": setFrame('signin-phone-reroute'); break;
    case "goto-newdevice2": setFrame('signin-phone-reroute'); break;
    case "login-mac": {
      if (state.flowId === '07') { setFrame('signin-phone-reroute'); }
      else { showOverlay('mac-touchid'); state._loginPath=true; }
      break;
    }
    case "back": {
      const prev = state.history.pop();
      if (prev) setFrame(prev, {noHistory:true});
      break;
    }
    default: {
      // Action card handlers
      if (act.startsWith('ac-tab:')){
        const a = getAction(); a.tab = act.split(':')[1]; a.amount=''; a.openPicker=null; a.preview=null;
        rerenderActionCard(); break;
      }
      if (act.startsWith('ac-open:')){
        const a = getAction(); const k = act.split(':')[1];
        a.openPicker = a.openPicker===k ? null : k;
        rerenderActionCard(); break;
      }
      if (act.startsWith('ac-set-asset:')){
        const a = getAction(); const sym = act.split(':')[1];
        if (a.tab==='deposit') a.depositAsset = sym; else a.withdrawAsset = sym;
        a.openPicker = null; rerenderActionCard(); break;
      }
      if (act.startsWith('ac-set-route:')){
        const a = getAction(); const id = act.split(':')[1];
        if (a.tab==='deposit') a.depositRoute = id; else a.withdrawRoute = id;
        a.openPicker = null; rerenderActionCard(); break;
      }
      if (act.startsWith('ac-set-from:')){
        const a = getAction(); a.swapFrom = act.split(':')[1]; a.openPicker = null; rerenderActionCard(); break;
      }
      if (act.startsWith('ac-set-to:')){
        const a = getAction(); a.swapTo = act.split(':')[1]; a.openPicker = null; rerenderActionCard(); break;
      }
      if (act === 'ac-continue'){
        const a = getAction();
        const cur = a.tab==='deposit' ? a.depositAsset : a.tab==='withdraw' ? a.withdrawAsset : null;
        const route = a.tab==='deposit' ? a.depositRoute : a.tab==='withdraw' ? a.withdrawRoute : null;
        // gate: only proceed if valid
        let ok=false;
        if (a.tab==='deposit'){ ok = !!cur && !!route && (route==='external_wallet' || (a.amount && parseFloat(a.amount)>0)); }
        else if (a.tab==='withdraw'){ ok = !!cur && !!route && a.amount && parseFloat(a.amount)>0; }
        else if (a.tab==='swap'){ ok = !!a.swapFrom && !!a.swapTo && a.swapFrom!==a.swapTo && a.amount && parseFloat(a.amount)>0; }
        if (!ok) break;
        a.preview = { tab:a.tab, asset:cur, fromAsset:a.swapFrom, toAsset:a.swapTo, route, amount:a.amount };
        rerenderActionCard(); break;
      }
      if (act === 'ac-back'){
        const a = getAction(); a.preview = null; rerenderActionCard(); break;
      }
      if (act === 'banner-cta') { state.kycFrom = state.homeOutcome || 'first-time'; setFrame('kyc-profile'); break; }
      if (act === 'ac-open-flow' || act === 'home-deposit' || act === 'home-move' || act === 'view-wallets' || act === 'fy-recovery' || act === 'fy-move' || act.startsWith('open-wallet-') || act === 'view-all-txns' || act === 'noop'){
        // demo no-ops
        break;
      }
    }
  }
}

// ============== Tweaks panel wiring ==============
// Axis state — the user reasons about journey + account + os + outcome,
// and we resolve that combo to the matching FLOWS preset.
const axes = { journey:"signup", account:"personal", os:"mac", outcome:"success", home:"first-time" };

// Map axis combos → flowId. Only legal combos are listed; everything else
// auto-falls back to the closest legal preset (and the UI greys the offending toggle).
function resolveFlowId(){
  const {journey, account, os, outcome, home} = axes;
  if (journey === "home") {
    return axes.home === 'kyc-progress'   ? 'HK'
         : axes.home === 'tier2-unlocked' ? 'HT'
         :                                  'HF';
  }
  if (journey === "kyc") {
    return 'K1';
  }
  if (journey === "signin") {
    if (outcome === "recover-passkey") return "R1";
    return outcome === "recover" ? "07" : "06";
  }
  // signup
  if (outcome === "no-hardware")    return "05";
  if (outcome === "keychain-off")   return "03";   // mac-only — caller must clamp
  if (outcome === "apple-mismatch") return "04";   // mac-only — caller must clamp
  if (account === "business")       return "08";
  return os === "win" ? "02" : "01";               // happy
}

// Which axis values are illegal given the *other* axis values right now?
function illegalAxes(){
  const ill = { journey:new Set(), account:new Set(), os:new Set(), outcome:new Set(), home:new Set() };
  const isSignup = axes.journey === "signup";
  const isSignin = axes.journey === "signin";
  const isHome   = axes.journey === "home";
  const isKyc    = axes.journey === "kyc";
  // Account type only meaningful for signup
  if (!isSignup) { ill.account.add("personal"); ill.account.add("business"); }
  // OS only meaningful for signup (passkey behavior differs by OS); home & signin look the same
  if (!isSignup) { ill.os.add("mac"); ill.os.add("win"); }
  // Outcome semantics differ per journey
  if (isSignin) {
    ill.outcome.add("keychain-off");
    ill.outcome.add("apple-mismatch");
    ill.outcome.add("no-hardware");
  } else if (isSignup) {
    // Signup doesn't have a recover outcome
    ill.outcome.add("recover");
  }
  // Mac-specific failures (signup only)
  if (isSignup && axes.os === "win") {
    ill.outcome.add("keychain-off");
    ill.outcome.add("apple-mismatch");
  }
  // Business signup currently only mocked for Mac happy path
  if (isSignup && axes.account === "business") {
    if (axes.os === "win") ill.os.add("win");
    if (axes.outcome !== "success") ill.outcome.add(axes.outcome);
  }
  return ill;
}

// Clamp axes to nearest legal combo so the resolved flowId always exists
function clampAxes(){
  const ill = illegalAxes();
  if (ill.account.has(axes.account)) axes.account = "personal";
  if (ill.outcome.has(axes.outcome)) axes.outcome = "success";
  // os doesn't get clamped — user choice wins, illegal os disables outcomes instead
}

function paintAxes(){
  clampAxes();
  const ill = illegalAxes();
  const isHome = axes.journey === "home";
  const isKyc  = axes.journey === "kyc";
  // Show home-state section only for home journey; show traditional outcome otherwise
  const oSec = document.getElementById('tw-outcome-section');
  const hSec = document.getElementById('tw-home-outcome-section');
  if (oSec) oSec.style.display = (isHome || isKyc) ? 'none' : '';
  if (hSec) hSec.style.display = isHome ? '' : 'none';
  ["journey","account","os","outcome"].forEach(axis => {
    const grp = document.getElementById('tw-'+axis);
    if (!grp) return;
    grp.querySelectorAll('button').forEach(b => {
      const v = b.dataset[axis];
      const isOn = v === axes[axis];
      const isIll = ill[axis].has(v);
      b.classList.toggle('on', isOn && !isIll);
      b.disabled = isIll;
    });
  });
  // Home outcome buttons (only "on" state matters; never illegal)
  const hg = document.getElementById('tw-home-outcome');
  if (hg) {
    hg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', b.dataset.home === axes.home);
    });
  }
  // Hint copy
  const hint = document.getElementById('tw-journey-hint');
  if (hint) {
    hint.textContent =
      isHome                     ? "Post-onboarding dashboard. Pick a state to inspect." :
      isKyc                      ? "Tier 2 KYC verification — profile, identity, and submission." :
      axes.journey === "signin"  ? "Sign in to an existing account. Pick ‘Recover on new device’ if there’s no passkey here yet." :
                                   "Create a new account from scratch.";
  }
}

function applyAxes(){
  paintAxes();
  state.os = axes.os;
  const id = resolveFlowId();
  // sync presets dropdown to the resolved flow
  const sel = document.getElementById('tw-path');
  if (sel) sel.value = id;
  // For home journey, the home-state radio drives state.homeOutcome directly
  // (all home flows resolve to the same flowId, so startFlow won't change it).
  if (axes.journey === 'home') state.homeOutcome = axes.home || 'tier2-unlocked';
  startFlow(id);
  if (axes.journey === 'home') {
    state.homeOutcome = axes.home || 'tier2-unlocked';
    setFrame('dashboard');
  }
}

["journey","account","os","outcome"].forEach(axis => {
  const grp = document.getElementById('tw-'+axis);
  if (!grp) return;
  grp.addEventListener('click', e => {
    const b = e.target.closest('button['+'data-'+axis+']');
    if (!b || b.disabled) return;
    axes[axis] = b.dataset[axis];
    applyAxes();
  });
});

// Home-state radio
document.addEventListener('click', e => {
  const b = e.target && e.target.closest && e.target.closest('#tw-home-outcome button[data-home]');
  if (!b) return;
  axes.home = b.dataset.home;
  applyAxes();
});

// Quick scenarios — back-fill the axes from the chosen preset so they reflect the jump
function axesFromFlowId(id){
  const map = {
    "01": {journey:"signup", account:"personal", os:"mac", outcome:"success"},
    "02": {journey:"signup", account:"personal", os:"win", outcome:"success"},
    "03": {journey:"signup", account:"personal", os:"mac", outcome:"keychain-off"},
    "04": {journey:"signup", account:"personal", os:"mac", outcome:"apple-mismatch"},
    "05": {journey:"signup", account:"personal", os:"mac", outcome:"no-hardware"},
    "06": {journey:"signin", account:"personal", os:"mac", outcome:"success"},
    "07": {journey:"signin", account:"personal", os:"mac", outcome:"recover"},
    "08": {journey:"signup",  account:"business", os:"mac", outcome:"success"},
    "H6": {journey:"home", account:"personal", os:"mac", outcome:"success", home:"first-time"},
    "HF": {journey:"home", account:"personal", os:"mac", outcome:"success", home:"first-time"},
    "HK": {journey:"home", account:"personal", os:"mac", outcome:"success", home:"kyc-progress"},
    "HT": {journey:"home", account:"personal", os:"mac", outcome:"success", home:"tier2-unlocked"},
    "K1": {journey:"kyc", account:"personal", os:"mac", outcome:"success"},
    "R1": {journey:"signin", account:"personal", os:"mac", outcome:"recover-passkey"},
  };
  return map[id] || map["01"];
}

document.getElementById('tw-path').addEventListener('change', e => {
  const id = e.target.value;
  if (!id) return;
  Object.assign(axes, axesFromFlowId(id));
  applyAxes();
});

document.getElementById('tw-restart').addEventListener('click', ()=> startFlow(state.flowId));
document.getElementById('tw-prev').addEventListener('click', ()=>{
  const prev = state.history.pop();
  if (prev) setFrame(prev, {noHistory:true});
});

// Initial paint
paintAxes();

// ============== Tour Guide ==============
state.tourEnabled = true;
const tourStops = [
  { selector: '[data-tour-stop="balance"]', title: 'Your balance, and Move Money', body: 'Everything you hold is totalled in dollars, and can be viewed in other currencies as well. Move Money sends, receives, or swaps.', placement: 'bottom' },
  { selector: '[data-tour-stop="currencies"]', title: 'Currencies you hold', body: 'One row per currency. Tap to see wallet details.', placement: 'bottom' },
  { selector: '[data-tour-stop="kyc"]', title: 'Verify your identity', body: 'A few minutes to confirm who you are. After that you can cash out crypto to fiat accounts (NGN, EUR or GBP), fund from a bank.', placement: 'bottom' },
  { selector: '[data-tour-stop="transactions"]', title: 'Activity history', body: 'Every send, receive, and swap shows up here once you start using your wallet.', placement: 'top' }
];
(function(){
  const tour = document.getElementById('tour');
  const spotlight = document.getElementById('spotlight');
  const card = document.getElementById('tourCard');
  const arrow = document.getElementById('tourArrow');
  const titleEl = document.getElementById('tourTitle');
  const bodyEl = document.getElementById('tourBody');
  const stepEl = document.getElementById('tourStep');
  const dotsEl = document.getElementById('tourDots');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  const skipBtn = document.getElementById('skipBtn');
  let currentIdx = 0;
  function buildDots(){ dotsEl.innerHTML=''; tourStops.forEach(()=>{ const d=document.createElement('div'); d.className='d'; dotsEl.appendChild(d); }); }
  function updateDots(){ Array.from(dotsEl.children).forEach((d,i)=>d.classList.toggle('active', i===currentIdx)); }
  function positionFor(stop){
    const selectors = Array.isArray(stop.selector)?stop.selector:[stop.selector];
    const targets = selectors.map(s=>document.querySelector(s)).filter(Boolean);
    if (!targets.length) return null;
    let top=Infinity,left=Infinity,bottom=-Infinity,right=-Infinity;
    targets.forEach(t=>{ const r=t.getBoundingClientRect(); if(r.top<top)top=r.top; if(r.left<left)left=r.left; if(r.bottom>bottom)bottom=r.bottom; if(r.right>right)right=r.right; });
    const pad=10;
    return { top:window.scrollY+top-pad, left:window.scrollX+left-pad, width:(right-left)+pad*2, height:(bottom-top)+pad*2, rect:{top,left,bottom,right,width:right-left,height:bottom-top} };
  }
  function showStop(i){
    const stop = tourStops[i];
    const pos = positionFor(stop);
    if (!pos){ console.warn('Tour: no element for', stop.selector); return; }
    spotlight.style.top=pos.top+'px'; spotlight.style.left=pos.left+'px'; spotlight.style.width=pos.width+'px'; spotlight.style.height=pos.height+'px';
    titleEl.textContent=stop.title; bodyEl.textContent=stop.body; stepEl.textContent='Step '+(i+1)+' of '+tourStops.length;
    backBtn.style.visibility = i===0 ? 'hidden' : 'visible';
    nextBtn.textContent = i===tourStops.length-1 ? 'Got it' : 'Next';
    const cardW=340, cardH=card.offsetHeight||200, margin=20, viewportW=window.innerWidth;
    let placement = stop.placement || 'bottom';
    const spaceBelow = window.innerHeight - pos.rect.bottom;
    const spaceAbove = pos.rect.top;
    if (placement==='bottom' && spaceBelow < cardH+margin && spaceAbove > spaceBelow) placement='top';
    if (placement==='top' && spaceAbove < cardH+margin && spaceBelow > spaceAbove) placement='bottom';
    const targetCenterX = pos.left + pos.width/2;
    let cardLeft = Math.max(margin, Math.min(viewportW-cardW-margin, targetCenterX - cardW/2));
    let cardTop;
    if (placement==='bottom'){ cardTop = pos.top + pos.height + 16; arrow.className='tour-arrow top'; }
    else { cardTop = pos.top - cardH - 16; arrow.className='tour-arrow bottom'; }
    arrow.style.left = Math.max(20, Math.min(cardW-36, targetCenterX - cardLeft - 8)) + 'px';
    card.style.top = cardTop+'px'; card.style.left = cardLeft+'px';
    updateDots();
  }
  function startTour(){ currentIdx=0; tour.classList.add('active'); requestAnimationFrame(()=>{ card.classList.add('visible'); showStop(0); }); if (typeof syncTourCheckbox==='function') syncTourCheckbox(true); }
  function endTour(){ card.classList.remove('visible'); tour.classList.remove('active'); spotlight.style.top='50%'; spotlight.style.left='50%'; spotlight.style.width='0'; spotlight.style.height='0'; if (typeof syncTourCheckbox==='function') syncTourCheckbox(false); }
  nextBtn.addEventListener('click', ()=>{ if (currentIdx>=tourStops.length-1) endTour(); else { currentIdx++; showStop(currentIdx); } });
  backBtn.addEventListener('click', ()=>{ if (currentIdx>0){ currentIdx--; showStop(currentIdx); } });
  skipBtn.addEventListener('click', endTour);
  let resizeTimer;
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ if (tour.classList.contains('active')) showStop(currentIdx); }, 100); });
  buildDots();
  window.EntaTour = { start: startTour, end: endTour };
})();

// Show tour-section in tweaks only when first-time home is active; auto-start on first-time render
const tourSection = document.getElementById('tw-tour-section');
const tourCheckbox = document.getElementById('tw-tour-enabled');
tourCheckbox.addEventListener('change', e=>{
  if (e.target.checked) { window.EntaTour && window.EntaTour.start(); }
  else { window.EntaTour && window.EntaTour.end(); }
});
function syncTourCheckbox(on){ if (tourCheckbox) tourCheckbox.checked = !!on; }
function maybeStartTour(){
  const isFirstTimeHome = state.frame === 'dashboard' && (state.homeOutcome || 'first-time') === 'first-time';
  tourSection.style.display = (state.frame === 'dashboard') ? '' : 'none';
  if (isFirstTimeHome && !state._tourSeen) {
    state._tourSeen = true;
    setTimeout(()=> { window.EntaTour && window.EntaTour.start(); }, 450);
  } else if (!isFirstTimeHome && window.EntaTour) {
    window.EntaTour.end();
  }
}
const _origSetFrame = setFrame;
setFrame = function(id, opts){ const r = _origSetFrame(id, opts); maybeStartTour(); return r; };
const tweaks = document.getElementById('tweaks');
const fab = document.getElementById('tweaksFab');
document.getElementById('tweaksClose').addEventListener('click', ()=> tweaks.classList.add('collapsed'));
fab.addEventListener('click', ()=> tweaks.classList.remove('collapsed'));
// drag with viewport clamping
(()=>{
  const head = document.getElementById('tweaksHead');
  let dragging=false, ox=0, oy=0;
  head.addEventListener('mousedown', e=>{
    dragging=true; const r=tweaks.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
    tweaks.style.right='auto'; tweaks.style.bottom='auto';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if (!dragging) return;
    const r = tweaks.getBoundingClientRect();
    const w = r.width, h = r.height;
    let x = e.clientX-ox, y = e.clientY-oy;
    x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
    y = Math.max(8, Math.min(window.innerHeight - h - 8, y));
    tweaks.style.left = x+'px';
    tweaks.style.top = y+'px';
  });
  window.addEventListener('mouseup', ()=> dragging=false);
})();

// ============== Scaling: fit width ==============
function rescale(){
  const c = document.getElementById('canvas');
  const vp = document.querySelector('.viewport');
  const wrap = document.querySelector('.canvas-wrap');
  const padX = 48; // 24px each side
  const padY = 48;
  const sw = (window.innerWidth - padX) / 1440;
  const sh = (window.innerHeight - padY) / 1024;
  const s = Math.min(sw, sh, 1);
  c.style.transform = `scale(${s})`;
  wrap.style.width = (1440 * s) + 'px';
  wrap.style.height = (1024 * s) + 'px';
  vp.style.minHeight = (1024 * s + padY) + 'px';
}
window.addEventListener('resize', rescale);
rescale();

// ============== Boot ==============
startFlow('01');
